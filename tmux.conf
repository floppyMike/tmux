set  -g default-terminal "st-256color"
set  -g default-command  bash
set  -g base-index       1
setw -g pane-base-index  1

set -g status-keys vi
set -g mode-keys   vi

unbind C-b
set -g prefix C-Space
bind -N "Send the prefix key through to the application" \
  Space send-prefix
bind C-Space last-window

bind-key -N "Kill the current window" & kill-window
bind-key -N "Kill the current pane" x kill-pane

set  -g mouse             on
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       0
set  -g history-limit     10000

# Remove right status
set-option -g status-right ""

# Extend statusline max length for session name to not clip
set -g status-left-length 50

# Have smart mouse copy
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi C-WheelUpPane send-keys -X halfpage-up
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi y send -X copy-pipe "xclip -in -selection clipboard"

# Custom pane management
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Restart finished processes
bind r respawn-pane

# Moving panes
bind-key M choose-tree -Zw "join-pane -t '%%'"

# Window switching
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# Bar colors
set -g status-style "bg=#000000,fg=#CCCCCC"
# Window colors
set -g window-status-current-style "bg=#59C3FF,fg=#0A0E14"

# Helpers
bind g neww -c "#{pane_current_path}" -n lazygit lazygit
bind b neww -c "#{pane_current_path}" -n btop btop
bind n neww -c "#{pane_current_path}" -n nnn nnn

# Open with current pwd
unbind '"'
unbind %
unbind c
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
